name: Build JNI
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c
    - name: Unzip source
      run: unzip jni.zip
    - name: Build with ndk-build
      run: ndk-build
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: libs
        path: libs/
